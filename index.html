<!DOCTYPE html>
<html lang="en">
<head>
   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Stream Platform</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="bg-gray-800">

    <main>

        <aside id="aside-country" class="hidden absolute bg-[#1b1e29]/95 h-dvh w-full xl:w-100">

            <div class="flex justify-between">
                <input id="input-search-country" class="text-white p-3 w-full outline-none" type="text" placeholder="Search Country ...">
                <button id="btn-close-aside" class="text-gray-400 hover:text-gray-600 cursor-pointer text-2xl font-bold leading-none pr-4">&times;</button>
            </div>

            <ul id="list-country" class="max-h-dvh overflow-y-auto">

            </ul>

        </aside>

        <section class="p-4 xl:p-8">

            <div class="grid grid-cols-1 gap-3 xl:flex xl:justify-center xl:gap-6">

                <div class="space-y-2 xl:w-100">

                    <div class="flex gap-2 items-center">

                        <img id="img-aside-country" class="w-13 p-2 bg-black/40 hover:bg-black/20 rounded-md cursor-pointer" src="assets/icons/list.svg" alt="list-icon">
                        <input class="bg-black/40 hover:bg-black/20 shadow-md transition duration-300 hover p-3 text-white w-full rounded-md" type="text" placeholder="Search Channel ...">
                    
                    </div>

                    <ul id="list-channels" class="max-h-dvh xl:max-h-142 overflow-y-auto space-y-2">

                    </ul>

                </div>

                <div class="flex flex-col gap-3 xl:max-w-200">
                    
                    <video class="rounded-md" src="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"></video>    

                    <ul class="max-h-40 overflow-y-auto space-y-3">
                        
                        <li>
                            <div class="shadow-xl">
                                <h1 class="text-white text-2xl font-semibold">02:05 AM - 03:05AM 999: Critical Condition</h1>
                                <p class="text-gray-400">Documentary series following the work of major hospital truma untit. Helen has a life-threatening anseurism anseurism anseurism anseurism anseurism anseurism anseurism anseurism </p>
                            </div>
                        </li>

                    </ul>
                
                </div>

            </div>

        </section>
    </main>
    
    <script type="module" src="./js/main.js"></script>
    
</body>
</html>
