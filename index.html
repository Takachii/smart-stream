<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Stream Platform</title>

    <link rel="shortcut icon" href="assets/images/preview.png" type="image/x-icon">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

</head>
<body class="bg-[#0b0f19]">

    <main>

        <div id="home-loading" class="absolute flex flex-col gap-4 items-center justify-center inset-0">
            <div class="h-12 w-12 animate-spin rounded-full border-4 border-gray-200 border-t-gray-600"></div>
            <p id="text-error" class="text-white font-semibold">Request category and channels ...</p>
        </div>

        <aside id="aside-country" class="hidden absolute h-dvh w-full">

            <div class="bg-[#111827]/95 xl:w-100 h-dvh scrollbar-thumb-gray-500">
                <div class="flex justify-between bg-[#1a2234]">
                    <input id="input-search-country" class="text-slate-100 placeholder-slate-500 p-3 w-full outline-none" type="text" placeholder="Search Category by country ...">
                    <button id="btn-close-aside" class="text-slate-400 hover:text-sky-400 cursor-pointer text-2xl font-bold leading-none pr-4">&times;</button>
                </div>
    
                <ul id="list-country" class="max-h-dvh overflow-y-auto">
    
                </ul>
            </div>

        </aside>

        <section id="main-section" class="blur-md p-4 xl:p-8">

            <div class="grid grid-cols-1 gap-3 xl:flex xl:justify-center xl:gap-6">

                <div class="space-y-2 xl:w-100">

                    <div class="flex gap-2 items-center">

                        <img id="img-aside-country" class="w-13 p-2 bg-[#161d2e] hover:bg-sky-800/50 transition-colors rounded-md cursor-pointer" src="assets/icons/list.svg" alt="list-icon">
                        <input id="search-channels" class="bg-[#161d2e] hover:bg-[#1e2940] focus:bg-[#1e2940] placeholder-slate-500 shadow-md shadow-black/40 transition duration-300 hover p-3 text-slate-100 w-full rounded-md" type="text" placeholder="Search Channel ...">

                    </div>

                    <ul id="list-channels" class="max-h-dvh xl:max-h-142 overflow-y-auto space-y-2 scrollbar-thumb-gray-500">

                    </ul>

                </div>

                <div class="flex flex-col gap-3 xl:max-w-200">

                    <video id="channel-preview" class="rounded-md bg-black" controls autoplay muted></video>

                    <ul id="list-epg" class="max-h-40 overflow-y-auto space-y-3">

                        <li>
                            <div class="shadow-xl shadow-black/40">
                                <h1 class="text-slate-100 text-2xl font-semibold">00:00 AM - 00:00AM 000: No Channel Selected</h1>
                                <p class="text-slate-400">No Channel Selected to load EPG data ...</p>
                            </div>
                        </li>

                    </ul>

                </div>

            </div>

        </section>
    </main>

    <script type="module" src="./js/main.js"></script>

</body>
</html>
